
<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#09090b" />
  <title>AMINIX AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #09090b;
      color: #f4f4f5;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 950px;
      margin: auto;
      background: #09090b;
    }

    header {
      height: 68px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid #27272a;
      gap: 12px;
      background: #101014;
    }

    .logo {
      width: 39px;
      height: 39px;
      border-radius: 13px;
      background: linear-gradient(135deg, #8b5cf6, #4f46e5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      font-weight: bold;
      color: white;
    }

    .brand h1 {
      font-size: 19px;
      letter-spacing: 1px;
    }

    .brand p {
      font-size: 11px;
      color: #a1a1aa;
      margin-top: 3px;
    }

    .status {
      margin-left: auto;
      font-size: 11px;
      color: #4ade80;
    }

    .status span {
      display: inline-block;
      width: 7px;
      height: 7px;
      background: #4ade80;
      border-radius: 50%;
      margin-right: 5px;
    }

    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      padding: 14px 16px;
      border-radius: 17px;
      max-width: 85%;
      line-height: 1.6;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .message p {
      white-space: pre-line;
      margin: 0;
    }

    .user-message {
      background: #5140a5;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 5px;
    }

    .assistant-message {
      background: #1c1c24;
      color: #e4e4e7;
      align-self: flex-start;
      border: 1px solid #30303a;
      border-bottom-left-radius: 5px;
    }

    .welcome {
      text-align: center;
      margin: auto;
      padding: 20px;
      max-width: 440px;
    }

    .welcome-logo {
      width: 68px;
      height: 68px;
      border-radius: 22px;
      background: linear-gradient(135deg, #8b5cf6, #4f46e5);
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: bold;
    }

    .welcome h2 {
      font-size: 25px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #a1a1aa;
      font-size: 14px;
      line-height: 1.6;
    }

    .typing-indicator {
      display: none;
      color: #a1a1aa;
      font-size: 12px;
      padding: 8px 20px;
    }

    .typing-indicator.visible {
      display: block;
    }

    .message-input {
      display: flex;
      gap: 10px;
      padding: 14px 15px;
      background: #101014;
      border-top: 1px solid #27272a;
      align-items: flex-end;
    }

    #user-input {
      flex: 1;
      min-width: 0;
      min-height: 48px;
      max-height: 120px;
      resize: none;
      padding: 14px;
      border: 1px solid #353540;
      border-radius: 15px;
      background: #1c1c24;
      color: white;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }

    #user-input:focus {
      border-color: #8b5cf6;
    }

    #user-input::placeholder {
      color: #71717a;
    }

    #send-button {
      height: 48px;
      min-width: 52px;
      border: none;
      border-radius: 14px;
      background: #7453dc;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    #send-button:hover {
      background: #8b5cf6;
    }

    #send-button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    footer {
      text-align: center;
      padding: 9px;
      color: #71717a;
      font-size: 10px;
      background: #101014;
    }

    @media (min-width: 700px) {
      .chat-messages {
        padding: 30px 45px;
      }

      .message-input {
        padding: 18px 35px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="logo">A</div>
      <div class="brand">
        <h1>AMINIX AI</h1>
        <p>Tu inteligencia artificial</p>
      </div>
      <div class="status"><span></span>Asistente</div>
    </header>

    <div class="chat-container">
      <div id="chat-messages" class="chat-messages">
        <div class="welcome">
          <div class="welcome-logo">A</div>
          <h2>Hola, soy AMINIX</h2>
          <p>Estoy aquí para ayudarte. Pregúntame lo que quieras y empezamos.</p>
        </div>
      </div>

      <div class="typing-indicator" id="typing-indicator">
        AMINIX está pensando...
      </div>

      <div class="message-input">
        <textarea
          id="user-input"
          placeholder="Habla con Aminix..."
          rows="1"
          autofocus
        ></textarea>
        <button id="send-button" aria-label="Enviar">➤</button>
      </div>
    </div>

    <footer>
      AMINIX AI · Tu asistente inteligente
    </footer>
  </div>

  <script src="chat.js"></script>
</body>
</html>
